<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Border Studio</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="overlay">
  <svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
  <script src="/shared.js"></script>
  <script>
    applyOverlayBackground();
    const stage = document.getElementById("stage");
    let d;
    let lay = { padX: 0, padY: 0, overlayW: 1920, overlayH: 1080, cameraW: 1920 };
    function paint() {
      if (!d) return;
      const scale = d.width ? (lay.cameraW || d.width) / d.width : 1;
      renderBorder(stage, d, {
        handles: false,
        padX: lay.padX || 0,
        padY: lay.padY || 0,
        overlayW: lay.overlayW,
        overlayH: lay.overlayH,
        scale,
      });
    }
    async function load() {
      try {
        const [des, anim, layout] = await Promise.all([fetch("/api/design"), fetch("/api/anims"), fetch("/api/obs/layout")]);
        if (!des.ok) return;
        d = await des.json();
        if (anim.ok) {
          const doc = await anim.json();
          customAnims = doc.custom || [];
        }
        if (layout.ok) lay = await layout.json();
        paint();
      } catch (e) {}
    }
    load();
    const es = new EventSource("/api/events");
    es.onmessage = (ev) => {
      const msg = (ev.data || "").trim();
      if (msg.startsWith("event ")) {
        const id = msg.slice(6);
        const evn = (d && d.events || []).find(e => e.id === id);
        fireOverlayAnim(evn ? evn.anim : id, evn && evn.tune);
        return;
      }
      if (msg === "update" || msg === "hello") load();
    };
  </script>
</body>
</html>
